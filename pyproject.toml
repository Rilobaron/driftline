[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "driftline"
version = "0.1.0"
description = "An AI-assisted quantitative trading, backtesting and market research platform built with Python."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Driftline Contributors" }]
keywords = ["trading", "backtesting", "quantitative", "market-research"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Topic :: Office/Business :: Financial",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pandas>=2.2",
  "numpy>=1.26",
  "ccxt>=4.3",
  "SQLAlchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "ruff>=0.5",
  "mypy>=1.11",
]

[project.scripts]
driftline-demo = "driftline.backtesting.demo:main"

[tool.hatch.build.targets.wheel]
packages = ["src/driftline"]

[tool.hatch.build]
artifacts = []

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF100"]
# B008 flags `Depends()` in defaults, which is the canonical FastAPI idiom.
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
[[tool.mypy.overrides]]
module = ["tests.*", "alembic.*"]
ignore_errors = false
strict = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "ruff>=0.5",
  "mypy>=1.11",
]
