services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: driftline
      POSTGRES_PASSWORD: driftline
      POSTGRES_DB: driftline
    ports:
      - "5432:5432"
    volumes:
      - driftline_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U driftline -d driftline"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://driftline:driftline@db:5432/driftline
      DRIFTLINE_EXCHANGE: binance
      DRIFTLINE_SYMBOL: BTC/USDT
      DRIFTLINE_TIMEFRAME: 1h
    ports:
      - "8000:8000"
    command: ["uvicorn", "driftline.api.main:app", "--host", "0.0.0.0", "--port", "8000"]

volumes:
  driftline_pgdata:
