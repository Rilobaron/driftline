services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: driftline
      POSTGRES_PASSWORD: driftline
      POSTGRES_DB: driftline
    ports:
      - "5432:5432"
    volumes:
      - driftline_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U driftline -d driftline"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://driftline:driftline@db:5432/driftline
      DRIFTLINE_EXCHANGE: binance
      DRIFTLINE_SYMBOL: BTC/USDT
      DRIFTLINE_TIMEFRAME: 1h
      DRIFTLINE_MARKET_STREAMS: binance:BTC/USDT:1h,binance:ETH/USDT:1h,binance:SOL/USDT:1h
      # The API never owns the scheduler (single-owner: the worker does).
      DRIFTLINE_SCHEDULER_ENABLED: 0
    ports:
      - "8000:8000"
    command: ["sh", "-c", "alembic upgrade head && uvicorn driftline.api.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://driftline:driftline@db:5432/driftline
      DRIFTLINE_MARKET_STREAMS: binance:BTC/USDT:1h,binance:ETH/USDT:1h,binance:SOL/USDT:1h
      DRIFTLINE_SCHEDULER_ENABLED: 1
      DRIFTLINE_SYNC_DELAY_SECONDS: 90
      DRIFTLINE_BOOTSTRAP_MONTHS: 12
    command: ["sh", "-c", "alembic upgrade head && python -m driftline.worker"]
    restart: unless-stopped
    # Single-worker deployment: never scale past 1 replica — per-stream DB
    # leases guard against accidents, but one owner is the supported model.

  paper:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://driftline:driftline@db:5432/driftline
      DRIFTLINE_PAPER_INTERVAL: 60
      DRIFTLINE_PAPER_FEE_RATE: 0.001
      DRIFTLINE_PAPER_SLIPPAGE_RATE: 0.0005
      DRIFTLINE_PAPER_ALLOCATION: 1.0
      DRIFTLINE_OPS_TOKEN: ${DRIFTLINE_OPS_TOKEN:-}
    command: ["sh", "-c", "alembic upgrade head && python -m driftline.paper.worker"]
    restart: unless-stopped
    # Single-executor deployment: never scale past 1 replica — per-session DB
    # leases guard against accidents, but one paper worker is the supported model.

volumes:
  driftline_pgdata:
